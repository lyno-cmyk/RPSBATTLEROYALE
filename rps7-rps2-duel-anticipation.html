<!DOCTYPE html>
<html>
  
  <head>
    <title>Rock paper scissors Battleroyale 3</title>
    <style>
        * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #171717;
      color: white;
      font-family: Arial, sans-serif;
    }

    .game-shell {
      display: flex;
      align-items: flex-start;
      gap: 20px;
    }

    .settings-panel {
      width: 220px;
      padding: 16px;
      border: 2px solid #555;
      border-radius: 8px;
      background: #222;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .settings-panel h2 {
      margin: 0 0 4px;
      font-size: 20px;
      text-align: center;
    }

    .property {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 13px;
      color: #ddd;
    }

    .property input,
    .property select {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      text-align: center;
      font-size: 16px;
    }

    .checkbox-property {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .checkbox-property input {
      width: 18px;
      height: 18px;
    }

    #goButton {
      width: 100%;
      margin-top: 4px;
    }

    button {
      padding: 10px 24px;
      border: none;
      border-radius: 6px;
      background: #4ade80;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #22c55e;
    }

    #arena {
      position: relative;
      width: 600px;
      height: 600px;
      max-width: 90vw;
      max-height: 90vw;
      border: 4px solid #555;
      border-radius: 5%;
      background: #222;
      overflow: hidden;
    }

    .unit {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      user-select: none;
    }

    .rock {
      background: #9ca3af00;
      
    }

    .paper {
      background: #f8fafc00;
      
    }

    .scissors {
      background: #f8717100;
      
    }

    .bullet {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #facc15;
      border: 1px solid #fef08a;
      box-shadow: 0 0 5px rgba(250, 204, 21, 0.7);
      pointer-events: none;
    }

    .projectile {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fb923c;
      box-shadow: 0 0 5px rgba(251, 146, 60, 0.8);
      pointer-events: none;
    }
    .game-layout {
  display: flex;
  align-items: flex-start;
  gap: 20px;
}

#leaderboard {
  width: 220px;
  min-height: 200px;
  padding: 16px;
  border: 2px solid #555;
  border-radius: 8px;
  background: #222;
}

#leaderboard h2 {
  margin: 0 0 12px;
  font-size: 20px;
  text-align: center;
}

.leaderboard-entry {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid #444;
  font-size: 14px;
}

.leaderboard-entry:last-child {
  border-bottom: none;
}

.unit-name {
  font-weight: bold;
}

.kill-count {
  color: #4ade80;
  font-weight: bold;
}

@media (max-width: 850px) {
  .game-layout {
    flex-direction: column;
    align-items: center;
  }

  #leaderboard {
    width: 600px;
    max-width: 90vw;
  }
}
.unit {
  overflow: visible;
}

.unit-emoji {
  font-size: 15px;
}

.unit-label {
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255, 255, 255, 0.425);
  font-size: 8px;
  font-weight: bold;
  white-space: nowrap;
  pointer-events: none;
}

.health-bar {
  position: absolute;
  left: 50%;
  bottom: -6px;
  transform: translateX(-50%);
  width: 26px;
  height: 4px;
  background: #3f3f46;
  border: 1px solid #18181b;
  border-radius: 3px;
  overflow: hidden;
  pointer-events: none;
  z-index: 3;
}

.health-fill {
  height: 100%;
  width: 100%;
  background: #22c55e;
  transition: width 0.08s linear;
}

.unit-label.maxed {
  color: #fdba74;
}

.duel-countdown { position:absolute; left:50%; top:-30px; transform:translateX(-50%); color:#fff; font-size:16px; font-weight:900; text-shadow:0 2px 4px #000,0 0 8px rgba(255,255,255,.7); pointer-events:none; z-index:20; }
.duel-roll { position:absolute; left:50%; top:-32px; transform:translateX(-50%); color:#facc15; font-size:13px; font-weight:900; text-shadow:0 2px 4px #000; pointer-events:none; z-index:20; }
.duel-announce { position:absolute; transform:translate(-50%,-50%); color:#fff; font-size:22px; font-weight:1000; white-space:nowrap; text-shadow:0 3px 6px #000,0 0 12px #facc15; pointer-events:none; z-index:30; animation:duelRise 1s ease-out forwards; }
.duel-winner { position:absolute; left:50%; top:-46px; transform:translateX(-50%); color:#4ade80; font-size:15px; font-weight:1000; text-shadow:0 2px 5px #000,0 0 8px #22c55e; pointer-events:none; z-index:25; }
@keyframes duelRise { 0%{opacity:0;transform:translate(-50%,8px) scale(.8)} 20%{opacity:1} 100%{opacity:0;transform:translate(-50%,-38px) scale(1.08)} }

.unit.player-controlled {
  filter: drop-shadow(0 0 5px #60a5fa);
}

.leaderboard-entry {
  cursor: pointer;
  user-select: none;
}

.leaderboard-entry.selected-player {
  outline: 2px solid #60a5fa;
  border-radius: 5px;
  background: rgba(96, 165, 250, 0.12);
}

.arena-column {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.unit-counts {
  display: flex;
  justify-content: center;
  gap: 10px;
  width: 600px;
  max-width: 90vw;
}

.unit-counts .property {
  flex: 1;
  min-width: 0;
}

.unit-counts .property input {
  width: 100%;
}

#startButton {
  min-width: 140px;
  display: none;
  background: #60a5fa;
  color: #111;
}

#startButton:hover {
  background: #3b82f6;
}

#matchTimer {
  min-width: 100px;
  padding: 6px 12px;
  border-radius: 6px;
  background: rgba(0, 0, 0, 0.65);
  border: 1px solid #555;
  text-align: center;
  font-weight: bold;
  font-size: 14px;
}

#winMessage {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.58);
  z-index: 50;
  pointer-events: none;
}

#winMessage span {
  padding: 18px 28px;
  border: 2px solid #fff;
  border-radius: 10px;
  background: rgba(20, 20, 20, 0.92);
  font-size: 32px;
  font-weight: bold;
  text-align: center;
}

.advanced-settings { margin-top: 14px; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 12px; }
.advanced-settings summary { cursor: pointer; font-weight: bold; padding: 8px 0; user-select: none; }
.advanced-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; max-height: 520px; overflow-y: auto; padding-right: 4px; }
.advanced-grid .property { font-size: 12px; gap: 4px; }
.advanced-grid input { width: 100%; box-sizing: border-box; padding: 5px; font-size: 12px; }

@media (max-width: 900px) {
  .game-shell {
    flex-direction: column;
    align-items: center;
  }

  .settings-panel {
    width: 600px;
    max-width: 90vw;
  }

  .unit-counts {
    width: 600px;
    max-width: 90vw;
  }
}

@media (max-width: 520px) {
  .unit-counts {
    flex-direction: column;
  }
}
    </style>
  </head>
  <body>
    <h1>Rock Papers scissors Battleroyale 3</h1>

    <div class="game-shell">
      <aside class="settings-panel">
        <h2>Properties</h2>

        <label class="property">
          Game Mode

        <label class="property">

        </label>

        <label class="property">
          🔫 Ammo Count
          <input id="bulletCount" type="number" value="30" min="0">
        </label>

        <label class="checkbox-property">
          <span>🔄 Respawn Ammo</span>
          <input id="ammoRespawnToggle" type="checkbox">
        </label>

        <details class="advanced-settings">
          <summary>⚙️ Advanced Settings</summary>
          <div class="advanced-grid">
            <label class="property">Prey Search Radius<input id="preySearchRadius" type="number" value="180" min="0" step="1"></label>
            <label class="property">Predator Search Radius<input id="predatorSearchRadius" type="number" value="120" min="0" step="1"></label>
            <label class="property">Wander Duration<input id="wanderDuration" type="number" value="120" min="0" step="1"></label>
            <label class="property">Flee Chance<input id="fleeChance" type="number" value="1" min="0" max="1" step="0.01"></label>
            <label class="property">Flee Check Interval<input id="fleeCheckInterval" type="number" value="30" min="0" step="1"></label>
            <label class="property">Predator Avoid Radius<input id="predatorAvoidRadius" type="number" value="42" min="0" step="1"></label>
            <label class="property">Bullet Pickup Radius<input id="bulletPickupRadius" type="number" value="22" min="0" step="1"></label>
            <label class="property">Bullet Search Radius<input id="bulletSearchRadius" type="number" value="170" min="0" step="1"></label>
            <label class="property">Bullet Speed<input id="bulletSpeed" type="number" value="3" min="0" step="0.1"></label>
            <label class="property">Bullet Lifetime<input id="bulletLifetime" type="number" value="90" min="0" step="1"></label>
            <label class="property">Aim Spread<input id="aimSpread" type="number" value="0" min="0" step="0.1"></label>
            <label class="property">Shoot Cooldown<input id="shootCooldown" type="number" value="45" min="0" step="1"></label>
            <label class="property">Chase Weight<input id="chaseWeight" type="number" value="1" min="0" step="0.1"></label>
            <label class="property">Base Radius<input id="baseRadius" type="number" value="6" min="0" step="1"></label>
            <label class="property">Radius Per Kill<input id="radiusPerKill" type="number" value="1" min="0" step="0.1"></label>
            <label class="property">Max Radius<input id="maxRadius" type="number" value="12" min="0" step="1"></label>
            <label class="property">Collision Padding<input id="collisionPadding" type="number" value="4" min="0" step="1"></label>
            <label class="property">Speed Per Kill<input id="speedPerKill" type="number" value="0.035" min="0" step="0.001"></label>
            <label class="property">Max Speed<input id="maxSpeed" type="number" value="2.4" min="0" step="0.1"></label>
            <label class="property">Base HP<input id="baseHp" type="number" value="10" min="0" step="1"></label>
            <label class="property">HP Per Size<input id="hpPerSize" type="number" value="1" min="0" step="0.1"></label>
            <label class="property">Melee Damage<input id="meleeDamage" type="number" value="1" min="0" step="0.1"></label>
            <label class="property">Damage Interval<input id="damageInterval" type="number" value="20" min="0" step="1"></label>
            <label class="property">Bullet Damage<input id="bulletDamage" type="number" value="5" min="0" step="1"></label>
            <label class="property">Kill Heal<input id="killHeal" type="number" value="2" min="0" step="0.1"></label>
            <label class="property">Wander Regen Amount<input id="wanderRegenAmount" type="number" value="1" min="0" step="0.1"></label>
            <label class="property">Wander Regen Interval<input id="wanderRegenInterval" type="number" value="120" min="0" step="1"></label>
            <label class="property">Ammo Respawn Interval<input id="ammoRespawnInterval" type="number" value="180" min="0" step="1"></label>
            <label class="property">Ammo Respawn Amount<input id="ammoRespawnAmount" type="number" value="1" min="0" step="1"></label>
            <label class="property">RPS² Duel Radius<input id="duelRadius" type="number" value="22" min="0" step="1"></label>
            <label class="property">RPS² Duel Cooldown<input id="duelCooldown" type="number" value="45" min="0" step="1"></label>
            <label class="property">RPS² Duel Damage<input id="duelDamage" type="number" value="9999" min="1" step="1"></label>
          </div>
        </details>

      </aside>

      <div class="arena-column">
        <div class="unit-counts">
          <label class="property">
            💎 Rocks
            <input id="rockCount" type="number" value="10" min="0">
          </label>

          <label class="property">
            📄 Papers
            <input id="paperCount" type="number" value="10" min="0">
          </label>

          <label class="property">
            ✂️ Scissors
            <input id="scissorsCount" type="number" value="10" min="0">
          </label>
        </div>

        <button id="goButton" type="button">GO</button>

        <div id="arena">
          <div id="winMessage"><span></span></div>
        </div>
        <button id="startButton" type="button">START</button>
      </div>

      <div id="leaderboard">
        <h2>Leaderboard</h2>
        <div id="matchTimer">5:00</div>
        <div id="leaderboardEntries"></div>
      </div>
    </div>


    <script>
      const gameModeSelect = document.getElementById("gameMode");
      const arena = document.getElementById("arena");
      const goButton = document.getElementById("goButton");
      const ammoRespawnToggle = document.getElementById("ammoRespawnToggle");
      const startButton = document.getElementById("startButton");
      const winConditionSelect = document.getElementById("winCondition");
      const matchTimeInput = document.getElementById("matchTime");
      const matchTimer = document.getElementById("matchTimer");
      const winMessage = document.getElementById("winMessage");

      /*
      goButton.addEventListener("click", () => {
        console.log("Button pressed")
      }); 
      */

      let units = [];
      let bullets = [];
      let projectiles = [];
      let gameMode = "conversion";
      let ammoRespawnEnabled = false;
      let ammoRespawnTimer = 0;
      let gameRunning = false;
      let matchEnded = false;
      let winCondition = "last-standing";
      let matchTimeSeconds = 300;
      let matchStartTime = 0;
      let selectedPlayer = null;
      let playerDestination = null;
      let activeDuels = [];
      let nextUnitId = {
        rock: 1,
        paper: 1,
        scissors: 1
      };
 

      const unitTypes = {
      rock: {
        emoji: "💎",
        beats: "scissors"
      },
      paper: {
        emoji: "📄",
        beats: "rock"
      },
      scissors: {
        emoji: "✂️",
        beats: "paper"
      }
    };


    // =========================
    // AI CONFIGURATION
    // =========================
    const AI_CONFIG = {
      preySearchRadius: 180,       // How far a unit searches for prey
      predatorSearchRadius: 120,   // How far a unit detects predators
      wanderDuration: 120,         // Frames: 180 ~= 3 seconds at 60 FPS
      fleeChance: 1,            // Chance to flee when no prey is available
      fleeCheckInterval: 30,       // Frames between flee checks
      predatorAvoidRadius: 42,     // Personal danger zone around a predator
      bulletPickupRadius: 22,      // Distance needed to collect a bullet
      bulletSearchRadius: 170,     // Shooting range; units do not move toward bullets
      bulletSpeed: 3,
      bulletLifetime: 90,
      aimSpread: 0,             // Average aim: about +/- 12.5 degrees
      shootCooldown: 45,            // Frames between shots
      chaseWeight: 1,

      // Growth from kills
      baseRadius: 6,
      radiusPerKill: 1,
      maxRadius: 12,
      collisionPadding: 4,
      speedPerKill: 0.035,
      maxSpeed: 2.4,
      baseHp: 10,
      hpPerSize: 1,
      meleeDamage: 1,
      damageInterval: 20,
      bulletDamage: 5,
      killHeal: 2,
      wanderRegenAmount: 1,
      wanderRegenInterval: 120,
      ammoRespawnInterval: 180,
      ammoRespawnAmount: 1,

      // Rock Paper Scissors² duels
      duelRadius: 22,
      duelCooldown: 45,
      duelDamage: 9999
    };

    function applyAdvancedSettings() {
      const fields = [
        "preySearchRadius", "predatorSearchRadius", "wanderDuration",
        "fleeChance", "fleeCheckInterval", "predatorAvoidRadius",
        "bulletPickupRadius", "bulletSearchRadius", "bulletSpeed",
        "bulletLifetime", "aimSpread", "shootCooldown", "chaseWeight",
        "baseRadius", "radiusPerKill", "maxRadius", "collisionPadding",
        "speedPerKill", "maxSpeed", "baseHp", "hpPerSize", "meleeDamage",
        "damageInterval", "bulletDamage", "killHeal", "wanderRegenAmount",
        "wanderRegenInterval", "ammoRespawnInterval", "ammoRespawnAmount",
        "duelRadius", "duelCooldown", "duelDamage"
      ];
      for (const key of fields) {
        const input = document.getElementById(key);
        if (!input) continue;
        const value = Number(input.value);
        if (Number.isFinite(value)) AI_CONFIG[key] = value;
      }
      AI_CONFIG.fleeChance = Math.max(0, Math.min(1, AI_CONFIG.fleeChance));
      AI_CONFIG.maxRadius = Math.max(AI_CONFIG.baseRadius, AI_CONFIG.maxRadius);
      AI_CONFIG.ammoRespawnInterval = Math.max(1, AI_CONFIG.ammoRespawnInterval);
      AI_CONFIG.ammoRespawnAmount = Math.max(0, Math.floor(AI_CONFIG.ammoRespawnAmount));
    }

    function createUnit(type) {
                const { width, height } = getArenaBounds();

                const unitSize = 13;

                const prefixes = {
                  rock: "r",
                  paper: "p",
                  scissors: "s"
                };

                const name = `${prefixes[type]}${nextUnitId[type]}`;

                nextUnitId[type]++;

                return {
                  type: type,
                  name: name,

                  x: Math.random() * Math.max(0, width - unitSize),
                  y: Math.random() * Math.max(0, height - unitSize),

                  baseRadius: AI_CONFIG.baseRadius,
                  radius: AI_CONFIG.baseRadius,
                  collisionRadius: AI_CONFIG.baseRadius + AI_CONFIG.collisionPadding,

                  baseSpeed: Math.random() * 0.6 + 0.6,
                  speed: 0.9,

                  vx: 0,
                  vy: 0,

                  behavior: "hunt",
                  target: null,

                  kills: 0,

                  fleeCheckTimer: 0,
                  wanderTimer: 0,
                  wanderDirection: null,
                  knownPrey: null,
                  ammo: 0,
                  maxHp: AI_CONFIG.baseHp,
                  hp: AI_CONFIG.baseHp,
                  attackCooldown: 0,
                  // Fixed per-unit tie-breaker used when sliding along a wall.
                  // Keeps the escape direction stable across frames instead of
                  // being re-rolled with Math.random() every tick.
                  cornerBias: {
                    x: Math.random() < 0.5 ? 1 : -1,
                    y: Math.random() < 0.5 ? 1 : -1
                  },
                  shootCooldown: Math.floor(Math.random() * AI_CONFIG.shootCooldown),
                  isPlayer: false,
                  playerDestination: null,
                  duelCooldown: 0,
                  duelRoll: null,
                  duelFlashTimer: 0,
                  duel: null,
                };
              }

    function updateUnitStats(unit) {
      // Every kill permanently increases the unit's size and speed.
      unit.radius = Math.min(
        unit.baseRadius + unit.kills * AI_CONFIG.radiusPerKill,
        AI_CONFIG.maxRadius
      );

      unit.collisionRadius = unit.radius + AI_CONFIG.collisionPadding;

      unit.speed = Math.min(
        unit.baseSpeed + unit.kills * AI_CONFIG.speedPerKill,
        AI_CONFIG.maxSpeed
      );

      // Health and damage scale with the unit's current size.
      unit.maxHp = AI_CONFIG.baseHp +
        (unit.radius - AI_CONFIG.baseRadius) * AI_CONFIG.hpPerSize;
      unit.hp = Math.min(unit.hp, unit.maxHp);
      unit.damage = AI_CONFIG.meleeDamage *
        (unit.radius / AI_CONFIG.baseRadius);
    }

    function registerKill(unit) {
      unit.kills++;
      const oldMaxHp = unit.maxHp;
      updateUnitStats(unit);
      const maxHpGain = Math.max(0, unit.maxHp - oldMaxHp);
      unit.hp = Math.min(unit.maxHp, unit.hp + AI_CONFIG.killHeal + maxHpGain);
    }

    function spawnUnits() {
          units = [];
          nextUnitId = {
            rock: 1,
            paper: 1,
            scissors: 1
          };

          const rockCount = Number(document.getElementById("rockCount").value);
          const paperCount = Number(document.getElementById("paperCount").value);
          const scissorsCount = Number(document.getElementById("scissorsCount").value);
          const bulletCount = Number(document.getElementById("bulletCount").value);

          winCondition = winConditionSelect.value;
          const requestedMinutes = Number(matchTimeInput.value);
          matchTimeSeconds = Math.max(6, requestedMinutes * 60);
          matchStartTime = 0;
          matchEnded = false;
          winMessage.style.display = "none";
          winMessage.querySelector("span").textContent = "";
          updateMatchTimer(matchTimeSeconds);

          bullets = [];
          projectiles = [];
          activeDuels = [];
          selectedPlayer = null;
          playerDestination = null;
          gameRunning = false;
          startButton.style.display = "block";
          startButton.textContent = "START";
          ammoRespawnEnabled = document.getElementById("ammoRespawnToggle").checked;
          ammoRespawnTimer = 0;

          for (let i = 0; i < rockCount; i++) {
            units.push(createUnit("rock"));
          }

          for (let i = 0; i < paperCount; i++) {
            units.push(createUnit("paper"));
          }

          for (let i = 0; i < scissorsCount; i++) {
            units.push(createUnit("scissors"));
          }

          spawnBullets(bulletCount);
          drawUnits();
          updateLeaderboard();
      }

      function drawUnits() {
          arena.innerHTML = "";

          for (const bullet of bullets) {
            const element = document.createElement("div");
            element.className = "bullet";
            element.style.left = `${bullet.x - 4}px`;
            element.style.top = `${bullet.y - 4}px`;
            arena.appendChild(element);
          }

          for (const projectile of projectiles) {
            const element = document.createElement("div");
            element.className = "projectile";
            element.style.left = `${projectile.x - 3}px`;
            element.style.top = `${projectile.y - 3}px`;
            arena.appendChild(element);
          }

          for (const unit of units) {
            const element = document.createElement("div");

            element.className = `unit ${unit.type}${unit.isPlayer ? " player-controlled" : ""}`;
            const maxed = unit.radius >= AI_CONFIG.maxRadius - 0.001;
            const duel = gameMode === "rps2" ? unit.duel : null;
            let duelOverlay = "";
            if (duel) {

                        if (gameMode === "rps2" && (a.duel || b.duel)) continue;

                        // x/y are the top-left corner, so calculate the real
                        // center of each unit before measuring the distance.
                        const aCenterX = a.x + a.radius;
                        const aCenterY = a.y + a.radius;
                        const bCenterX = b.x + b.radius;
                        const bCenterY = b.y + b.radius;

                        const dx = bCenterX - aCenterX;
                        const dy = bCenterY - aCenterY;
                        let distance = Math.sqrt(dx * dx + dy * dy);

                        // Keep the actual unit circles from overlapping.
                        // Combat is allowed exactly when their real edges touch.
                        const minimumDistance =
                          a.radius + b.radius;

                        if (distance >= minimumDistance) continue;

                        let normalX;
                        let normalY;

                        // Handle exact center overlap deterministically.
                        if (distance < 0.0001) {
                          const angle = ((i * 92821 + j * 68917) % 360) * Math.PI / 180;
                          normalX = Math.cos(angle);
                          normalY = Math.sin(angle);
                          distance = 0.0001;
                        } else {
                          normalX = dx / distance;
                          normalY = dy / distance;
                        }

                        const overlap = minimumDistance - distance;

                        // Push both units apart. Equal push prevents one unit
                        // from being permanently favored in crowded groups.
                        const pushX = normalX * overlap * 0.5;
                        const pushY = normalY * overlap * 0.5;

                        a.x -= pushX;
                        a.y -= pushY;
                        b.x += pushX;
                        b.y += pushY;

                        keepInsideArena(a);
                        keepInsideArena(b);
                        movedAny = true;
                      }
                    }

                    if (!movedAny) break;
                  }
                }

                function getWanderDirection(unit) {
                  if (!unit.wanderDirection || unit.wanderTimer <= 0) {
                    const angle = Math.random() * Math.PI * 2;
                    unit.wanderDirection = {
                      x: Math.cos(angle),
                      y: Math.sin(angle)
                    };
                    unit.wanderTimer = AI_CONFIG.wanderDuration;
                  }

                  unit.wanderTimer--;
                  return unit.wanderDirection;
                }

                 function updateAI(unit) {
                    // Rock Paper Scissors²: units seek nearby opponents rather than
                    // following the normal type-based predator/prey rules. Combat is
                    // resolved by a proximity duel when they get close enough.
                    if (gameMode === "rps2") {
                      updateUnitStats(unit);
                      if (unit.duel) { unit.vx = unit.vy = 0; return; }
                      unit.target = findClosestUnitAny(unit, AI_CONFIG.preySearchRadius);
                      unit.behavior = unit.target ? "duel" : "wander";

                      let steering = calculateSteering(unit, unit.target, []);
                      if (steering.x === 0 && steering.y === 0) {
                        steering = getWanderDirection(unit);
                      }
                      applySteering(unit, steering);
                      return;
                    }

                    // Keep size and speed synchronized with the kill count.
                    updateUnitStats(unit);

                    const nearbyPredators = getPredatorsNear(
                      unit,
                      AI_CONFIG.predatorSearchRadius
                    );

                    const isMaxed = unit.radius >= AI_CONFIG.maxRadius - 0.001;

                    // A fully grown prey becomes aggressive: it no longer flees
                    // and can chase its predators.
                    if (isMaxed) {
                      unit.target = nearbyPredators.length > 0
                        ? nearbyPredators[0]
                        : chooseTarget(unit);

                      if (unit.target) {
                        unit.behavior = "hunt";
                        unit.wanderTimer = 0;
                      } else {
                        unit.behavior = "wander";
                      }
                    } else {
                      // Each unit only uses its own local prey search.
                      unit.target = chooseTarget(unit);

                    if (unit.target) {
                      // Hunting always overrides wandering and fleeing.
                      unit.behavior = "hunt";
                      unit.wanderTimer = 0;
                    } else if (unit.behavior === "flee") {
                      // Flee only while a predator is directly near this unit.
                      if (nearbyPredators.length === 0) {
                        unit.behavior = "wander";
                        unit.wanderTimer = 0;
                      }
                    } else {
                      // No prey is known. Periodically decide whether to flee;
                      // otherwise continue wandering.
                      unit.fleeCheckTimer--;

                      if (unit.fleeCheckTimer <= 0) {
                        unit.fleeCheckTimer = AI_CONFIG.fleeCheckInterval;

                        if (
                          nearbyPredators.length > 0 &&
                          Math.random() < AI_CONFIG.fleeChance
                        ) {
                          unit.behavior = "flee";
                          unit.wanderTimer = 0;
                        } else {
                          unit.behavior = "wander";
                        }
                      }
                    }
                    }

                    let steering = calculateSteering(
                      unit,
                      unit.target,
                      isMaxed ? [] : nearbyPredators
                    );

                    // Never let a zero steering vector freeze a unit.
                    if (steering.x === 0 && steering.y === 0) {
                      steering = getWanderDirection(unit);
                    }

                    applySteering(unit, steering);
                  }

                  function canGoAroundPredators(unit, target, predators) {
                    if (!target || predators.length === 0) return true;

                    const direct = normalizeVector({
                      x: target.x - unit.x,
                      y: target.y - unit.y
                    });

                    const leftRoute = { x: -direct.y, y: direct.x };
                    const rightRoute = { x: direct.y, y: -direct.x };

                    const routes = [leftRoute, rightRoute];

                    for (const route of routes) {
                      const waypoint = {
                        x: unit.x + direct.x * 35 + route.x * 55,
                        y: unit.y + direct.y * 35 + route.y * 55
                      };

                      let routeIsClear = true;

                      for (const predator of predators) {
                        if (getDistance(waypoint, predator) < AI_CONFIG.predatorAvoidRadius) {
                          routeIsClear = false;
                          break;
                        }
                      }

                      if (routeIsClear) return true;
                    }

                    return false;
                  }

                  function calculateSteering(unit, target, predators) {
                    let steering = { x: 0, y: 0 };

                    // HUNTING HAS THE HIGHEST PRIORITY.
                    if (target) {
                      const routeIsBlocked =
                        predators.length > 0 &&
                        !canGoAroundPredators(unit, target, predators);

                      if (routeIsBlocked) {
                        // The prey exists, but the predator blocks both tested
                        // routes, so temporarily move away from danger.
                        const fleeForce = fleeFromPredators(unit, predators);
                        steering = addVectors(
                          steering,
                          multiplyVector(fleeForce, 2)
                        );
                      } else {
                        const seekForce = seek(unit, target);
                        steering = addVectors(
                          steering,
                          multiplyVector(seekForce, 4)
                        );
                      }

                      steering = constrainSteeringToArena(unit, steering);
                      return normalizeVector(steering);
                    }

                    // No prey: flee only when the unit is in flee mode and a
                    // predator is directly nearby.
                    if (unit.behavior === "flee" && predators.length > 0) {
                      const fleeForce = fleeFromPredators(unit, predators);
                      steering = addVectors(
                        steering,
                        multiplyVector(fleeForce, 2)
                      );
                    } else {
                      // No prey and no active flee: wander for a few seconds.
                      const wanderForce = getWanderDirection(unit);
                      steering = addVectors(
                        steering,
                        multiplyVector(wanderForce, 1)
                      );
                    }

                    steering = constrainSteeringToArena(unit, steering);
                    return normalizeVector(steering);
                  }

function constrainSteeringToArena(unit, steering) {
                            const { width, height } = getArenaBounds();

                            const unitSize = unit.radius * 2;
                            const margin = 0;

                            const maxX = width - unitSize;
                            const maxY = height - unitSize;

                            let result = {
                              x: steering.x,
                              y: steering.y
                            };

                            const nearLeft = unit.x <= margin;
                            const nearRight = unit.x >= maxX - margin;
                            const nearTop = unit.y <= margin;
                            const nearBottom = unit.y >= maxY - margin;

                            // Block only movement that goes farther into a wall
                            if (nearLeft && result.x < 0) {
                              result.x = 0;
                            }

                            if (nearRight && result.x > 0) {
                              result.x = 0;
                            }

                            if (nearTop && result.y < 0) {
                              result.y = 0;
                            }

                            if (nearBottom && result.y > 0) {
                              result.y = 0;
                            }

                            // If both movement components were blocked, the unit is
                            // pinned against a wall (or corner). Instead of picking a
                            // random escape direction every frame - which made units
                            // flicker back and forth in place, looking "stuck" - slide
                            // along the wall in whichever tangent direction best
                            // matches what the unit originally wanted to do (e.g. still
                            // moving away from whatever predator it was fleeing).
                            if (result.x === 0 && result.y === 0) {
                              const escapeDirections = [];

                              if (nearLeft || nearRight) {
                                escapeDirections.push({ x: 0, y: 1 });
                                escapeDirections.push({ x: 0, y: -1 });
                              }

                              if (nearTop || nearBottom) {
                                escapeDirections.push({ x: 1, y: 0 });
                                escapeDirections.push({ x: -1, y: 0 });
                              }

                              // Cornered against two walls at once: also allow
                              // moving straight out of the corner.
                              if ((nearLeft || nearRight) && (nearTop || nearBottom)) {
                                escapeDirections.push(normalizeVector({
                                  x: nearLeft ? 1 : -1,
                                  y: nearTop ? 1 : -1
                                }));
                              }

                              if (escapeDirections.length > 0) {
                                let best = escapeDirections[0];
                                let bestScore = -Infinity;

                                for (const candidate of escapeDirections) {
                                  // Alignment with the original desired direction
                                  // (e.g. away from a predator) picks the correct
                                  // side to slide toward.
                                  let score =
                                    candidate.x * steering.x +
                                    candidate.y * steering.y;

                                  // Break ties (e.g. steering is perfectly
                                  // perpendicular to the wall) with a per-unit
                                  // fixed bias instead of Math.random(), so the
                                  // choice stays consistent frame to frame
                                  // instead of vibrating in place.
                                  score += candidate.x * unit.cornerBias.x * 0.001;
                                  score += candidate.y * unit.cornerBias.y * 0.001;

                                  if (score > bestScore) {
                                    bestScore = score;
                                    best = candidate;
                                  }
                                }

                                result = best;
                              }
                            }

                            return normalizeVector(result);
                          }

              function applySteering(unit, steering) {
                unit.vx = steering.x * unit.speed;
                unit.vy = steering.y * unit.speed;

                unit.x += unit.vx;
                unit.y += unit.vy;
              }
        function keepInsideArena(unit) {
                  const { width, height } = getArenaBounds();

                  const unitSize = unit.radius * 2;

                  const maxX = width - unitSize;
                  const maxY = height - unitSize;

                  if (unit.x < 0) {
                    unit.x = 0;
                  }

                  if (unit.x > maxX) {
                    unit.x = maxX;
                  }

                  if (unit.y < 0) {
                    unit.y = 0;
                  }

                  if (unit.y > maxY) {
                    unit.y = maxY;
                  }
                }

        function seek(unit, target) {
            if (!target) {
              return { x: 0, y: 0 };
            }

            const desired = {
              x: target.x - unit.x,
              y: target.y - unit.y
            };

            return normalizeVector(desired);
          }

        function getSurvivingTypes() {
          return ["rock", "paper", "scissors"].filter(type =>
            units.some(unit => unit.type === type)
          );
        }

        function getTypeCounts() {
          return {
            rock: units.filter(unit => unit.type === "rock").length,
            paper: units.filter(unit => unit.type === "paper").length,
            scissors: units.filter(unit => unit.type === "scissors").length
          };
        }

        function finishGame(message) {
          if (matchEnded) return;

          matchEnded = true;
          gameRunning = false;
          startButton.style.display = "none";
          winMessage.querySelector("span").textContent = message;
          winMessage.style.display = "flex";
          drawUnits();
          updateLeaderboard();
        }

        function checkWinConditions() {
          if (matchEnded) return true;

          const survivingTypes = getSurvivingTypes();

          // Condition 1: the last remaining class wins.
          if (winCondition === "last-standing") {
            if (survivingTypes.length === 1) {
              const winner = survivingTypes[0];
              finishGame(`${unitTypes[winner].emoji} ${winner.toUpperCase()} WINS!`);
              return true;
            }

            if (survivingTypes.length === 0) {
              finishGame("Draw");
              return true;
            }
          }

          // Condition 2: when the timer expires, the class with the most
          // surviving units wins. Equal counts produce a draw.
          if (winCondition === "timed" && matchStartTime > 0) {
            const elapsed = (performance.now() - matchStartTime) / 1000;
            if (elapsed >= matchTimeSeconds) {
              const counts = getTypeCounts();
              const maxCount = Math.max(counts.rock, counts.paper, counts.scissors);
              const leaders = Object.entries(counts)
                .filter(([, count]) => count === maxCount)
                .map(([type]) => type);

              if (leaders.length === 1) {
                const winner = leaders[0];
                finishGame(`${unitTypes[winner].emoji} ${winner.toUpperCase()} WINS!`);
              } else {
                finishGame("Draw");
              }
              return true;
            }
          }

          return false;
        }

        function updateMatchTimer(remainingSeconds) {
          const safeSeconds = Math.max(0, Math.ceil(remainingSeconds));
          const minutes = Math.floor(safeSeconds / 60);
          const seconds = safeSeconds % 60;
          matchTimer.textContent = `${minutes}:${String(seconds).padStart(2, "0")}`;
        }

        function updateMatchClock() {
          if (!gameRunning || matchEnded || winCondition !== "timed" || matchStartTime === 0) {
            return;
          }

          const elapsed = (performance.now() - matchStartTime) / 1000;
          updateMatchTimer(matchTimeSeconds - elapsed);
        }

        function gameLoop() {
          if (!gameRunning) return;

          updateUnits();
          checkWinConditions();
          updateMatchClock();
          drawUnits();
          updateLeaderboard();

          if (gameRunning) {
            requestAnimationFrame(gameLoop);
          }
        }

        winConditionSelect.addEventListener("change", () => {
          const timed = winConditionSelect.value === "timed";
          matchTimeInput.disabled = !timed;
          matchTimer.style.display = timed ? "block" : "none";
        });

        winConditionSelect.dispatchEvent(new Event("change"));

        // Let the toggle take effect immediately, even mid-match, instead of
        // only being read once when GO is pressed.
        ammoRespawnToggle.addEventListener("change", () => {
          ammoRespawnEnabled = ammoRespawnToggle.checked;
          ammoRespawnTimer = 0;
        });

        goButton.addEventListener("click", () => {
          applyAdvancedSettings();
          gameMode = gameModeSelect.value;

          // GO only creates the battle setup. The simulation remains frozen
          // until the player presses START below the arena.
          spawnUnits();
        });

        startButton.addEventListener("click", () => {
          if (units.length === 0 || matchEnded) return;

          gameRunning = true;
          matchStartTime = performance.now();
          startButton.style.display = "none";

          requestAnimationFrame(gameLoop);
        });

        arena.addEventListener("click", (event) => {
          if (!gameRunning || !selectedPlayer || !units.includes(selectedPlayer)) return;
          movePlayerTo(selectedPlayer, event.clientX - arena.getBoundingClientRect().left,
            event.clientY - arena.getBoundingClientRect().top);
        });

        arena.addEventListener("contextmenu", (event) => {
          event.preventDefault();
        });

        arena.addEventListener("mousedown", (event) => {
          if (event.button !== 2) return;
          event.preventDefault();

          if (!selectedPlayer || !units.includes(selectedPlayer)) return;
          shootPlayerInDirection(selectedPlayer, event.clientX, event.clientY);
        });

    </script>
  </body>
</html>
