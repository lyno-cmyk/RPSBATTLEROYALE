<!DOCTYPE html>
<html>
  
  <head>
    <title>Rock paper scissors Battleroyale 3</title>
    <style>
        * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #171717;
      color: white;
      font-family: Arial, sans-serif;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      align-items: center;
    }

    .controls label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: center;
    }

    input {
      width: 80px;
      padding: 8px;
      border: none;
      border-radius: 6px;
      text-align: center;
      font-size: 16px;
    }

    button {
      padding: 10px 24px;
      border: none;
      border-radius: 6px;
      background: #4ade80;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #22c55e;
    }

    #arena {
      position: relative;
      width: 600px;
      height: 600px;
      max-width: 90vw;
      max-height: 90vw;
      border: 4px solid #555;
      border-radius: 5%;
      background: #222;
      overflow: hidden;
    }

    .unit {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      user-select: none;
    }

    .rock {
      background: #9ca3af00;
      
    }

    .paper {
      background: #f8fafc00;
      
    }

    .scissors {
      background: #f8717100;
      
    }

    .bullet {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #facc15;
      border: 1px solid #fef08a;
      box-shadow: 0 0 5px rgba(250, 204, 21, 0.7);
      pointer-events: none;
    }

    .projectile {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fb923c;
      box-shadow: 0 0 5px rgba(251, 146, 60, 0.8);
      pointer-events: none;
    }
    .game-layout {
  display: flex;
  align-items: flex-start;
  gap: 20px;
}

#leaderboard {
  width: 220px;
  min-height: 200px;
  padding: 16px;
  border: 2px solid #555;
  border-radius: 8px;
  background: #222;
}

#leaderboard h2 {
  margin: 0 0 12px;
  font-size: 20px;
  text-align: center;
}

.leaderboard-entry {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid #444;
  font-size: 14px;
}

.leaderboard-entry:last-child {
  border-bottom: none;
}

.unit-name {
  font-weight: bold;
}

.kill-count {
  color: #4ade80;
  font-weight: bold;
}

@media (max-width: 850px) {
  .game-layout {
    flex-direction: column;
    align-items: center;
  }

  #leaderboard {
    width: 600px;
    max-width: 90vw;
  }
}
.unit {
  overflow: visible;
}

.unit-emoji {
  font-size: 15px;
}

.unit-label {
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255, 255, 255, 0.425);
  font-size: 8px;
  font-weight: bold;
  white-space: nowrap;
  pointer-events: none;
}

.health-bar {
  position: absolute;
  left: 50%;
  bottom: -6px;
  transform: translateX(-50%);
  width: 26px;
  height: 4px;
  background: #3f3f46;
  border: 1px solid #18181b;
  border-radius: 3px;
  overflow: hidden;
  pointer-events: none;
  z-index: 3;
}

.health-fill {
  height: 100%;
  width: 100%;
  background: #22c55e;
  transition: width 0.08s linear;
}

.unit-label.maxed {
  color: #fdba74;
}

.unit.player-controlled {
  filter: drop-shadow(0 0 5px #60a5fa);
}

.leaderboard-entry {
  cursor: pointer;
  user-select: none;
}

.leaderboard-entry.selected-player {
  outline: 2px solid #60a5fa;
  border-radius: 5px;
  background: rgba(96, 165, 250, 0.12);
}

.arena-column {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

#startButton {
  min-width: 140px;
  display: none;
  background: #60a5fa;
  color: #111;
}

#startButton:hover {
  background: #3b82f6;
}
    </style>
  </head>
  <body>
    <h1>Rock Papers scissors Battleroyale 3</h1>

    <div class="controls">

      <label>
        Mode
        <select id="gameMode">
          <option value="conversion">Conversion</option>
          <option value="elimination">Elimination</option>
        </select>
      </label>

      <label>
        💎 Rocks
        <input id="rockCount" type="number" value="10" min="0" >
      </label>

      <label>
        📄 Papers
        <input id="paperCount" type="number" value="10" min="0" >
      </label>

      <label>
        ✂️ Scissors
        <input id="scissorsCount" type="number" value="10" min="0" >
      </label>

      <label>
        🔫 Bullets
        <input id="bulletCount" type="number" value="30" min="0" >
      </label>

      <label>
        🔄 Respawn Ammo
        <input id="ammoRespawnToggle" type="checkbox">
      </label>

      <button id="goButton">GO</button>
    </div>

            <div class="game-layout">
          <div class="arena-column"><div id="arena"></div><button id="startButton" type="button">START</button></div>

          <div id="leaderboard">
            <h2>Leaderboard</h2>
            <div id="leaderboardEntries"></div>
          </div>
        </div>


    <script>
      const gameModeSelect = document.getElementById("gameMode");
      const arena = document.getElementById("arena");
      const goButton = document.getElementById("goButton");
      const ammoRespawnToggle = document.getElementById("ammoRespawnToggle");
      const startButton = document.getElementById("startButton");
      /*
      goButton.addEventListener("click", () => {
        console.log("Button pressed")
      }); 
      */

      let units = [];
      let bullets = [];
      let projectiles = [];
      let gameMode = "conversion";
      let ammoRespawnEnabled = false;
      let ammoRespawnTimer = 0;
      let gameRunning = false;
      let selectedPlayer = null;
      let playerDestination = null;
      let nextUnitId = {
        rock: 1,
        paper: 1,
        scissors: 1
      };
 

      const unitTypes = {
      rock: {
        emoji: "💎",
        beats: "scissors"
      },
      paper: {
        emoji: "📄",
        beats: "rock"
      },
      scissors: {
        emoji: "✂️",
        beats: "paper"
      }
    };


    // =========================
    // AI CONFIGURATION
    // =========================
    const AI_CONFIG = {
      preySearchRadius: 180,       // How far a unit searches for prey
      predatorSearchRadius: 120,   // How far a unit detects predators
      wanderDuration: 120,         // Frames: 180 ~= 3 seconds at 60 FPS
      fleeChance: 1,            // Chance to flee when no prey is available
      fleeCheckInterval: 30,       // Frames between flee checks
      predatorAvoidRadius: 42,     // Personal danger zone around a predator
      bulletPickupRadius: 22,      // Distance needed to collect a bullet
      bulletSearchRadius: 170,     // Shooting range; units do not move toward bullets
      bulletSpeed: 3,
      bulletLifetime: 90,
      aimSpread: 0,             // Average aim: about +/- 12.5 degrees
      shootCooldown: 45,            // Frames between shots
      chaseWeight: 1,

      // Growth from kills
      baseRadius: 6,
      radiusPerKill: 1,
      maxRadius: 12,
      collisionPadding: 4,
      speedPerKill: 0.035,
      maxSpeed: 2.4,
      baseHp: 10,
      hpPerSize: 1,
      meleeDamage: 1,
      damageInterval: 20,
      bulletDamage: 5,
      killHeal: 2,
      wanderRegenAmount: 1,
      wanderRegenInterval: 120,
      ammoRespawnInterval: 180,
      ammoRespawnAmount: 1
    };

    function createUnit(type) {
                const { width, height } = getArenaBounds();

                const unitSize = 13;

                const prefixes = {
                  rock: "r",
                  paper: "p",
                  scissors: "s"
                };

                const name = `${prefixes[type]}${nextUnitId[type]}`;

                nextUnitId[type]++;

                return {
                  type: type,
                  name: name,

                  x: Math.random() * Math.max(0, width - unitSize),
                  y: Math.random() * Math.max(0, height - unitSize),

                  baseRadius: AI_CONFIG.baseRadius,
                  radius: AI_CONFIG.baseRadius,
                  collisionRadius: AI_CONFIG.baseRadius + AI_CONFIG.collisionPadding,

                  baseSpeed: Math.random() * 0.6 + 0.6,
                  speed: 0.9,

                  vx: 0,
                  vy: 0,

                  behavior: "hunt",
                  target: null,

                  kills: 0,

                  fleeCheckTimer: 0,
                  wanderTimer: 0,
                  wanderDirection: null,
                  knownPrey: null,
                  ammo: 0,
                  maxHp: AI_CONFIG.baseHp,
                  hp: AI_CONFIG.baseHp,
                  attackCooldown: 0,
                  // Fixed per-unit tie-breaker used when sliding along a wall.
                  // Keeps the escape direction stable across frames instead of
                  // being re-rolled with Math.random() every tick.
                  cornerBias: {
                    x: Math.random() < 0.5 ? 1 : -1,
                    y: Math.random() < 0.5 ? 1 : -1
                  },
                  shootCooldown: Math.floor(Math.random() * AI_CONFIG.shootCooldown),
                  isPlayer: false,
                  playerDestination: null,
                };
              }

    function updateUnitStats(unit) {
      // Every kill permanently increases the unit's size and speed.
      unit.radius = Math.min(
        unit.baseRadius + unit.kills * AI_CONFIG.radiusPerKill,
        AI_CONFIG.maxRadius
      );

      unit.collisionRadius = unit.radius + AI_CONFIG.collisionPadding;

      unit.speed = Math.min(
        unit.baseSpeed + unit.kills * AI_CONFIG.speedPerKill,
        AI_CONFIG.maxSpeed
      );

      // Health and damage scale with the unit's current size.
      unit.maxHp = AI_CONFIG.baseHp +
        (unit.radius - AI_CONFIG.baseRadius) * AI_CONFIG.hpPerSize;
      unit.hp = Math.min(unit.hp, unit.maxHp);
      unit.damage = AI_CONFIG.meleeDamage *
        (unit.radius / AI_CONFIG.baseRadius);
    }

    function registerKill(unit) {
      unit.kills++;
      const oldMaxHp = unit.maxHp;
      updateUnitStats(unit);
      const maxHpGain = Math.max(0, unit.maxHp - oldMaxHp);
      unit.hp = Math.min(unit.maxHp, unit.hp + AI_CONFIG.killHeal + maxHpGain);
    }

    function spawnUnits() {
          units = [];
          nextUnitId = {
            rock: 1,
            paper: 1,
            scissors: 1
          };

          const rockCount = Number(document.getElementById("rockCount").value);
          const paperCount = Number(document.getElementById("paperCount").value);
          const scissorsCount = Number(document.getElementById("scissorsCount").value);
          const bulletCount = Number(document.getElementById("bulletCount").value);

          bullets = [];
          projectiles = [];
          selectedPlayer = null;
          playerDestination = null;
          gameRunning = false;
          startButton.style.display = "block";
          startButton.textContent = "START";
          ammoRespawnEnabled = document.getElementById("ammoRespawnToggle").checked;
          ammoRespawnTimer = 0;

          for (let i = 0; i < rockCount; i++) {
            units.push(createUnit("rock"));
          }

          for (let i = 0; i < paperCount; i++) {
            units.push(createUnit("paper"));
          }

          for (let i = 0; i < scissorsCount; i++) {
            units.push(createUnit("scissors"));
          }

          spawnBullets(bulletCount);
          drawUnits();
          updateLeaderboard();
      }

      function drawUnits() {
          arena.innerHTML = "";

          for (const bullet of bullets) {
            const element = document.createElement("div");
            element.className = "bullet";
            element.style.left = `${bullet.x - 4}px`;
            element.style.top = `${bullet.y - 4}px`;
            arena.appendChild(element);
          }

          for (const projectile of projectiles) {
            const element = document.createElement("div");
            element.className = "projectile";
            element.style.left = `${projectile.x - 3}px`;
            element.style.top = `${projectile.y - 3}px`;
            arena.appendChild(element);
          }

          for (const unit of units) {
            const element = document.createElement("div");

            element.className = `unit ${unit.type}${unit.isPlayer ? " player-controlled" : ""}`;
            const maxed = unit.radius >= AI_CONFIG.maxRadius - 0.001;
            element.innerHTML = `
            <div class="health-bar"><div class="health-fill"></div></div>
            <span class="unit-emoji">${unitTypes[unit.type].emoji}</span>
            <span class="unit-label ${maxed ? "maxed" : ""}">${unit.name}${unit.ammo > 0 ? " 🔫" : ""}</span>
          `;

            const healthFill = element.querySelector(".health-fill");
            healthFill.style.width = `${Math.max(0, unit.hp / unit.maxHp) * 100}%`;

            element.style.left = `${unit.x}px`;
            element.style.top = `${unit.y}px`;
            element.style.width = `${unit.radius * 2}px`;
            element.style.height = `${unit.radius * 2}px`;

            const emojiElement = element.querySelector(".unit-emoji");
            emojiElement.style.fontSize = `${Math.max(15, unit.radius * 2.2)}px`;

            arena.appendChild(element);
          }

          if (selectedPlayer && selectedPlayer.playerDestination) {
            const marker = document.createElement("div");
            marker.style.position = "absolute";
            marker.style.width = "12px";
            marker.style.height = "12px";
            marker.style.border = "2px solid #60a5fa";
            marker.style.borderRadius = "50%";
            marker.style.left = `${selectedPlayer.playerDestination.x + selectedPlayer.radius - 6}px`;
            marker.style.top = `${selectedPlayer.playerDestination.y + selectedPlayer.radius - 6}px`;
            marker.style.pointerEvents = "none";
            marker.style.zIndex = "10";
            arena.appendChild(marker);
          }
        }

        function updateAmmoRespawn() {
          // The toggle was being read once at game start but nothing ever
          // actually spawned new bullets over time, so it had no effect.
          if (!ammoRespawnEnabled) return;

          ammoRespawnTimer++;

          if (ammoRespawnTimer >= AI_CONFIG.ammoRespawnInterval) {
            ammoRespawnTimer = 0;
            spawnBullets(AI_CONFIG.ammoRespawnAmount);
          }
        }

        function spawnBullets(count) {
          const { width, height } = getArenaBounds();

          for (let i = 0; i < count; i++) {
            bullets.push({
              x: 8 + Math.random() * Math.max(0, width - 16),
              y: 8 + Math.random() * Math.max(0, height - 16)
            });
          }
        }

        function collectNearbyBullet(unit) {
          if (unit.ammo >= 1) return;

          let closestIndex = -1;
          let closestDistance = AI_CONFIG.bulletPickupRadius;

          for (let i = 0; i < bullets.length; i++) {
            const distance = getDistance(unit, bullets[i]);
            if (distance < closestDistance) {
              closestDistance = distance;
              closestIndex = i;
            }
          }

          if (closestIndex !== -1) {
            bullets.splice(closestIndex, 1);
            unit.ammo = 1;
          }
        }

        function updateLeaderboard() {
              const leaderboardEntries =
                document.getElementById("leaderboardEntries");

              const sortedUnits = [...units]
                .sort((a, b) => b.kills - a.kills);

              leaderboardEntries.innerHTML = "";

              for (const unit of sortedUnits) {
                const entry = document.createElement("div");
                entry.className = `leaderboard-entry${selectedPlayer === unit ? " selected-player" : ""}`;
                entry.title = "Control this unit";

                entry.innerHTML = `
                  <span class="unit-name">
                    ${unit.name}${unit.isPlayer ? " 🎮" : ""}
                  </span>

                  <span class="kill-count">
                    ${unit.kills} ${unit.kills === 1 ? "kill" : "kills"}
                  </span>
                `;

                entry.addEventListener("click", () => {
                  if (!units.includes(unit)) return;

                  if (selectedPlayer && selectedPlayer !== unit) {
                    selectedPlayer.isPlayer = false;
                  }

                  selectedPlayer = unit;
                  selectedPlayer.isPlayer = true;
                  selectedPlayer.target = null;
                  selectedPlayer.behavior = "player";
                  selectedPlayer.playerDestination = null;
                  playerDestination = null;
                  drawUnits();
                  updateLeaderboard();
                });

                leaderboardEntries.appendChild(entry);
              }
            }
        function movePlayerTo(unit, x, y) {
  if (!unit || !units.includes(unit) || !gameRunning) return;

  const { width, height } = getArenaBounds();
  const maxX = width - unit.radius * 2;
  const maxY = height - unit.radius * 2;

  playerDestination = {
    x: Math.max(0, Math.min(maxX, x - unit.radius)),
    y: Math.max(0, Math.min(maxY, y - unit.radius))
  };

  unit.playerDestination = { ...playerDestination };
}

function updatePlayerControl(unit) {
  if (!unit || !unit.isPlayer || !gameRunning) return;

  unit.target = null;
  unit.behavior = "player";

  if (!unit.playerDestination) {
    unit.vx = 0;
    unit.vy = 0;
    return;
  }

  const dx = unit.playerDestination.x - unit.x;
  const dy = unit.playerDestination.y - unit.y;
  const distance = Math.sqrt(dx * dx + dy * dy);

  if (distance <= Math.max(2, unit.speed)) {
    unit.x = unit.playerDestination.x;
    unit.y = unit.playerDestination.y;
    unit.vx = 0;
    unit.vy = 0;
    unit.playerDestination = null;
    playerDestination = null;
    return;
  }

  const direction = normalizeVector({ x: dx, y: dy });
  unit.vx = direction.x * unit.speed;
  unit.vy = direction.y * unit.speed;
  unit.x += unit.vx;
  unit.y += unit.vy;
}

function shootPlayerInDirection(unit, clientX, clientY) {
  if (!unit || !unit.isPlayer || !gameRunning || unit.ammo <= 0 || unit.shootCooldown > 0) {
    return;
  }

  const rect = arena.getBoundingClientRect();
  const targetX = clientX - rect.left;
  const targetY = clientY - rect.top;
  const centerX = unit.x + unit.radius;
  const centerY = unit.y + unit.radius;
  const dx = targetX - centerX;
  const dy = targetY - centerY;

  if (dx === 0 && dy === 0) return;

  const angle = Math.atan2(dy, dx);

  projectiles.push({
    x: centerX,
    y: centerY,
    vx: Math.cos(angle) * AI_CONFIG.bulletSpeed,
    vy: Math.sin(angle) * AI_CONFIG.bulletSpeed,
    owner: unit,
    lifetime: AI_CONFIG.bulletLifetime
  });

  unit.ammo = 0;
  unit.shootCooldown = AI_CONFIG.shootCooldown;
}

function canDamage(attacker, prey) {
              if (attacker.type === prey.type) return false;

              // A normal RPS relationship allows the predator to damage its prey.
              // A max-sized unit can ALSO damage its former predator.
              const attackerIsElite =
                attacker.radius >= AI_CONFIG.maxRadius - 0.001;

              return (
                unitTypes[attacker.type].beats === prey.type ||
                (attackerIsElite && unitTypes[prey.type].beats === attacker.type)
              );
            }

       function checkCollisions() {
              // Each unit lands at most one melee hit per pass, against the
              // closest valid target it is currently touching - never several
              // targets at once just because more than one enemy is touching it.
              for (const attacker of units) {
                if (attacker.attackCooldown > 0) continue;

                let bestTarget = null;
                let bestDistance = Infinity;

                for (const other of units) {
                  if (other === attacker) continue;
                  if (!canDamage(attacker, other)) continue;

                  const aCenterX = attacker.x + attacker.radius;
                  const aCenterY = attacker.y + attacker.radius;
                  const bCenterX = other.x + other.radius;
                  const bCenterY = other.y + other.radius;

                  const dx = bCenterX - aCenterX;
                  const dy = bCenterY - aCenterY;
                  const distance = Math.sqrt(dx * dx + dy * dy);

                  // Combat uses the real circular hitboxes. The small tolerance
                  // prevents floating-point movement from cancelling a melee hit.
                  const touchDistance = attacker.radius + other.radius + 1.5;

                  if (distance <= touchDistance && distance < bestDistance) {
                    bestDistance = distance;
                    bestTarget = other;
                  }
                }

                if (bestTarget) {
                  applyMeleeDamage(attacker, bestTarget);
                }
              }
            }

          function applyMeleeDamage(attacker, prey) {
            if (!units.includes(attacker) || !units.includes(prey)) return;
            if (!canDamage(attacker, prey)) return;

            prey.hp -= attacker.damage;
            attacker.attackCooldown = AI_CONFIG.damageInterval;

            if (prey.hp > 0) return;

            registerKill(attacker);

            if (gameMode === "conversion") {
              // The unit is converted after being defeated, preserving the
              // existing conversion-mode rules.
              prey.type = attacker.type;
              prey.hp = prey.maxHp;
              prey.target = null;
              prey.behavior = "hunt";
              updateUnitStats(prey);
            } else if (gameMode === "elimination") {
              eliminateUnit(prey);
            }
          }

                function eliminateUnit(unit) {
                  const index = units.indexOf(unit);

                  if (index !== -1) {
                    units.splice(index, 1);
                  }
                }
         function canShootTarget(unit, target) {
           if (!target || target === unit) return false;

           if (gameMode === "conversion") {
             return isPredator(unit, target);
           }

           // Elimination mode: bullets can be used against both predators and prey.
           return target.type !== unit.type;
         }

         function findShootingTarget(unit) {
           if (unit.ammo <= 0) return null;

           let closest = null;
           let closestDistance = AI_CONFIG.bulletSearchRadius;

           for (const other of units) {
             if (!canShootTarget(unit, other)) continue;

             const distance = getDistance(unit, other);
             if (distance < closestDistance) {
               closestDistance = distance;
               closest = other;
             }
           }

           return closest;
         }

         function shootAt(unit, target) {
           if (!target || unit.ammo <= 0 || unit.shootCooldown > 0) return;

           const dx = target.x - unit.x;
           const dy = target.y - unit.y;
           const baseAngle = Math.atan2(dy, dx);
           const angle = baseAngle + (Math.random() * 2 - 1) * AI_CONFIG.aimSpread;

           projectiles.push({
             x: unit.x + unit.radius,
             y: unit.y + unit.radius,
             vx: Math.cos(angle) * AI_CONFIG.bulletSpeed,
             vy: Math.sin(angle) * AI_CONFIG.bulletSpeed,
             owner: unit,
             lifetime: AI_CONFIG.bulletLifetime
           });

           unit.ammo = 0;
           unit.shootCooldown = AI_CONFIG.shootCooldown;
         }

         function updateProjectiles() {
           for (let i = projectiles.length - 1; i >= 0; i--) {
             const projectile = projectiles[i];

             projectile.x += projectile.vx;
             projectile.y += projectile.vy;
             projectile.lifetime--;

             const { width, height } = getArenaBounds();
             if (
               projectile.lifetime <= 0 ||
               projectile.x < 0 ||
               projectile.y < 0 ||
               projectile.x > width ||
               projectile.y > height
             ) {
               projectiles.splice(i, 1);
               continue;
             }

             let hit = false;

             for (const target of [...units]) {
               if (target === projectile.owner) continue;
               if (!canShootTarget(projectile.owner, target)) continue;

               const centerX = target.x + target.radius;
               const centerY = target.y + target.radius;
               const dx = projectile.x - centerX;
               const dy = projectile.y - centerY;
               const hitDistance = target.radius + 4;

               if (dx * dx + dy * dy <= hitDistance * hitDistance) {
                 target.hp -= AI_CONFIG.bulletDamage;

                 if (target.hp <= 0) {
                   registerKill(projectile.owner);

                   // Bullets eliminate their target even in conversion mode.
                   eliminateUnit(target);
                 }

                 hit = true;
                 break;
               }
             }

             if (hit) {
               projectiles.splice(i, 1);
             }
           }
         }

         function updateUnits() {
                  for (const unit of units) {
                    if (unit.shootCooldown > 0) unit.shootCooldown--;

                    if (unit.isPlayer) {
                      updateUnitStats(unit);
                      updatePlayerControl(unit);
                    } else {
                      updateAI(unit);
                    }

                    if (unit.attackCooldown > 0) unit.attackCooldown--;

                    // Bullets are collected opportunistically while wandering.
                    // Units never choose a bullet as a movement target.
                  
                  collectNearbyBullet(unit);
                    

                    if (!unit.isPlayer) {
                      const shootingTarget = findShootingTarget(unit);
                      if (shootingTarget) {
                        shootAt(unit, shootingTarget);
                      }
                    }

                    keepInsideArena(unit);
                  }

                  updateProjectiles();
                  updateAmmoRespawn();

                  // Check melee combat BEFORE separating overlaps. This guarantees
                  // that units that actually touched during this frame can attack.
                  checkCollisions();

                  // Then separate all units so they cannot visually overlap.
                  resolveUnitOverlaps();
                }
            function isPredator(unit, other) {
                return unitTypes[other.type].beats === unit.type;
              }


              

          function isValidTarget(unit, target) {
              if (!target) return false;

              if (target.type !== unitTypes[unit.type].beats) {
                return false;
              }

              return true;
            }

            function chooseTarget(unit) {
              // Each unit hunts independently. No shared prey targets or group behavior.
              return findClosestTarget(unit, AI_CONFIG.preySearchRadius);
            }

            function findClosestTarget(unit, searchRadius = Infinity) {
              let closestTarget = null;
              let closestDistance = searchRadius;

              for (const other of units) {
                if (other === unit) continue;

                if (unitTypes[unit.type].beats !== other.type) {
                  continue;
                }

                const distance = getDistance(unit, other);

                if (distance < closestDistance) {
                  closestDistance = distance;
                  closestTarget = other;
                }
              }

              return closestTarget;
            }

        function wallAvoidance(unit) {
              const arenaSize = 600;
              const margin = 70;

              let force = {
                x: 0,
                y: 0
              };

              // Near the left wall: push right
              if (unit.x < margin) {
                force.x += (margin - unit.x) / margin;
              }

              // Near the right wall: push left
              if (unit.x > arenaSize - margin - unit.radius * 2) {
                force.x -= (
                  unit.x - (arenaSize - margin - unit.radius * 2)
                ) / margin;
              }

              // Near the top wall: push down
              if (unit.y < margin) {
                force.y += (margin - unit.y) / margin;
              }

              // Near the bottom wall: push up
              if (unit.y > arenaSize - margin - unit.radius * 2) {
                force.y -= (
                  unit.y - (arenaSize - margin - unit.radius * 2)
                ) / margin;
              }

              return normalizeVector(force);
            }

        function pursuit(unit, target) {
              if (!target) {
                return { x: 0, y: 0 };
              }

              const distance = getDistance(unit, target);

              const predictionTime = distance / 2;

              const futureX = target.x + target.vx * predictionTime;
              const futureY = target.y + target.vy * predictionTime;

              return normalizeVector({
                x: futureX - unit.x,
                y: futureY - unit.y
              });
            }




            
        /*Vector algorithm*/

        function addVectors(a, b) {
              return {
                x: a.x + b.x,
                y: a.y + b.y
              };
            }

            function multiplyVector(vector, scalar) {
              return {
                x: vector.x * scalar,
                y: vector.y * scalar
              };
            }

            function normalizeVector(vector) {
              const length = Math.sqrt(
                vector.x * vector.x +
                vector.y * vector.y
              );

              if (length === 0) {
                return { x: 0, y: 0 };
              }

              return {
                x: vector.x / length,
                y: vector.y / length
              };
            }

        function getNearbyUnits(unit, radius) {
            const nearby = [];

            for (const other of units) {
              if (other === unit) continue;

              const dx = other.x - unit.x;
              const dy = other.y - unit.y;

              const distance = Math.sqrt(dx * dx + dy * dy);

              if (distance <= radius) {
                nearby.push(other);
              }
            }

            return nearby;
          }

          function getPredatorsNear(unit, radius) {
              return getNearbyUnits(unit, radius).filter(
                other => isPredator(unit, other)
              );
            }
          function getDistance(a, b) {
              const dx = b.x - a.x;
              const dy = b.y - a.y;

              return Math.sqrt(dx * dx + dy * dy);
            }


        function countNearby(unit, radius) {
              const nearby = getNearbyUnits(unit, radius);

              let allies = 0;
              let enemies = 0;

              for (const other of nearby) {
                if (other.type === unit.type) {
                  allies++;
                } else {
                  enemies++;
                }
              }

              return { allies, enemies };
          }
                          function flee(unit, predator) {
                  const direction = {
                    x: unit.x - predator.x,
                    y: unit.y - predator.y
                  };

                  return normalizeVector(direction);
                }

            function fleeFromPredators(unit, predators) {
                  let force = { x: 0, y: 0 };

                  for (const predator of predators) {
                    const direction = flee(unit, predator);

                    force = addVectors(force, direction);
                  }

                  return normalizeVector(force);
                }
                function getArenaBounds() {
                  return {
                    width: arena.clientWidth,
                    height: arena.clientHeight
                  };
                }




                      function resolveUnitOverlaps() {
                  // Separate EVERY pair of units. This keeps units from visually
                  // overlapping while still allowing enemy units to touch and
                  // trigger their damage collision.
                  // Multiple passes handle chains/clusters of overlapping units.
                  const passes = 4;

                  for (let pass = 0; pass < passes; pass++) {
                    let movedAny = false;

                    for (let i = 0; i < units.length; i++) {
                      for (let j = i + 1; j < units.length; j++) {
                        const a = units[i];
                        const b = units[j];

                        // x/y are the top-left corner, so calculate the real
                        // center of each unit before measuring the distance.
                        const aCenterX = a.x + a.radius;
                        const aCenterY = a.y + a.radius;
                        const bCenterX = b.x + b.radius;
                        const bCenterY = b.y + b.radius;

                        const dx = bCenterX - aCenterX;
                        const dy = bCenterY - aCenterY;
                        let distance = Math.sqrt(dx * dx + dy * dy);

                        // Keep the actual unit circles from overlapping.
                        // Combat is allowed exactly when their real edges touch.
                        const minimumDistance =
                          a.radius + b.radius;

                        if (distance >= minimumDistance) continue;

                        let normalX;
                        let normalY;

                        // Handle exact center overlap deterministically.
                        if (distance < 0.0001) {
                          const angle = ((i * 92821 + j * 68917) % 360) * Math.PI / 180;
                          normalX = Math.cos(angle);
                          normalY = Math.sin(angle);
                          distance = 0.0001;
                        } else {
                          normalX = dx / distance;
                          normalY = dy / distance;
                        }

                        const overlap = minimumDistance - distance;

                        // Push both units apart. Equal push prevents one unit
                        // from being permanently favored in crowded groups.
                        const pushX = normalX * overlap * 0.5;
                        const pushY = normalY * overlap * 0.5;

                        a.x -= pushX;
                        a.y -= pushY;
                        b.x += pushX;
                        b.y += pushY;

                        keepInsideArena(a);
                        keepInsideArena(b);
                        movedAny = true;
                      }
                    }

                    if (!movedAny) break;
                  }
                }

                function getWanderDirection(unit) {
                  if (!unit.wanderDirection || unit.wanderTimer <= 0) {
                    const angle = Math.random() * Math.PI * 2;
                    unit.wanderDirection = {
                      x: Math.cos(angle),
                      y: Math.sin(angle)
                    };
                    unit.wanderTimer = AI_CONFIG.wanderDuration;
                  }

                  unit.wanderTimer--;
                  return unit.wanderDirection;
                }

                 function updateAI(unit) {
                    // Keep size and speed synchronized with the kill count.
                    updateUnitStats(unit);

                    const nearbyPredators = getPredatorsNear(
                      unit,
                      AI_CONFIG.predatorSearchRadius
                    );

                    const isMaxed = unit.radius >= AI_CONFIG.maxRadius - 0.001;

                    // A fully grown prey becomes aggressive: it no longer flees
                    // and can chase its predators.
                    if (isMaxed) {
                      unit.target = nearbyPredators.length > 0
                        ? nearbyPredators[0]
                        : chooseTarget(unit);

                      if (unit.target) {
                        unit.behavior = "hunt";
                        unit.wanderTimer = 0;
                      } else {
                        unit.behavior = "wander";
                      }
                    } else {
                      // Each unit only uses its own local prey search.
                      unit.target = chooseTarget(unit);

                    if (unit.target) {
                      // Hunting always overrides wandering and fleeing.
                      unit.behavior = "hunt";
                      unit.wanderTimer = 0;
                    } else if (unit.behavior === "flee") {
                      // Flee only while a predator is directly near this unit.
                      if (nearbyPredators.length === 0) {
                        unit.behavior = "wander";
                        unit.wanderTimer = 0;
                      }
                    } else {
                      // No prey is known. Periodically decide whether to flee;
                      // otherwise continue wandering.
                      unit.fleeCheckTimer--;

                      if (unit.fleeCheckTimer <= 0) {
                        unit.fleeCheckTimer = AI_CONFIG.fleeCheckInterval;

                        if (
                          nearbyPredators.length > 0 &&
                          Math.random() < AI_CONFIG.fleeChance
                        ) {
                          unit.behavior = "flee";
                          unit.wanderTimer = 0;
                        } else {
                          unit.behavior = "wander";
                        }
                      }
                    }
                    }

                    let steering = calculateSteering(
                      unit,
                      unit.target,
                      isMaxed ? [] : nearbyPredators
                    );

                    // Never let a zero steering vector freeze a unit.
                    if (steering.x === 0 && steering.y === 0) {
                      steering = getWanderDirection(unit);
                    }

                    applySteering(unit, steering);
                  }

                  function canGoAroundPredators(unit, target, predators) {
                    if (!target || predators.length === 0) return true;

                    const direct = normalizeVector({
                      x: target.x - unit.x,
                      y: target.y - unit.y
                    });

                    const leftRoute = { x: -direct.y, y: direct.x };
                    const rightRoute = { x: direct.y, y: -direct.x };

                    const routes = [leftRoute, rightRoute];

                    for (const route of routes) {
                      const waypoint = {
                        x: unit.x + direct.x * 35 + route.x * 55,
                        y: unit.y + direct.y * 35 + route.y * 55
                      };

                      let routeIsClear = true;

                      for (const predator of predators) {
                        if (getDistance(waypoint, predator) < AI_CONFIG.predatorAvoidRadius) {
                          routeIsClear = false;
                          break;
                        }
                      }

                      if (routeIsClear) return true;
                    }

                    return false;
                  }

                  function calculateSteering(unit, target, predators) {
                    let steering = { x: 0, y: 0 };

                    // HUNTING HAS THE HIGHEST PRIORITY.
                    if (target) {
                      const routeIsBlocked =
                        predators.length > 0 &&
                        !canGoAroundPredators(unit, target, predators);

                      if (routeIsBlocked) {
                        // The prey exists, but the predator blocks both tested
                        // routes, so temporarily move away from danger.
                        const fleeForce = fleeFromPredators(unit, predators);
                        steering = addVectors(
                          steering,
                          multiplyVector(fleeForce, 2)
                        );
                      } else {
                        const seekForce = seek(unit, target);
                        steering = addVectors(
                          steering,
                          multiplyVector(seekForce, 4)
                        );
                      }

                      steering = constrainSteeringToArena(unit, steering);
                      return normalizeVector(steering);
                    }

                    // No prey: flee only when the unit is in flee mode and a
                    // predator is directly nearby.
                    if (unit.behavior === "flee" && predators.length > 0) {
                      const fleeForce = fleeFromPredators(unit, predators);
                      steering = addVectors(
                        steering,
                        multiplyVector(fleeForce, 2)
                      );
                    } else {
                      // No prey and no active flee: wander for a few seconds.
                      const wanderForce = getWanderDirection(unit);
                      steering = addVectors(
                        steering,
                        multiplyVector(wanderForce, 1)
                      );
                    }

                    steering = constrainSteeringToArena(unit, steering);
                    return normalizeVector(steering);
                  }

function constrainSteeringToArena(unit, steering) {
                            const { width, height } = getArenaBounds();

                            const unitSize = unit.radius * 2;
                            const margin = 0;

                            const maxX = width - unitSize;
                            const maxY = height - unitSize;

                            let result = {
                              x: steering.x,
                              y: steering.y
                            };

                            const nearLeft = unit.x <= margin;
                            const nearRight = unit.x >= maxX - margin;
                            const nearTop = unit.y <= margin;
                            const nearBottom = unit.y >= maxY - margin;

                            // Block only movement that goes farther into a wall
                            if (nearLeft && result.x < 0) {
                              result.x = 0;
                            }

                            if (nearRight && result.x > 0) {
                              result.x = 0;
                            }

                            if (nearTop && result.y < 0) {
                              result.y = 0;
                            }

                            if (nearBottom && result.y > 0) {
                              result.y = 0;
                            }

                            // If both movement components were blocked, the unit is
                            // pinned against a wall (or corner). Instead of picking a
                            // random escape direction every frame - which made units
                            // flicker back and forth in place, looking "stuck" - slide
                            // along the wall in whichever tangent direction best
                            // matches what the unit originally wanted to do (e.g. still
                            // moving away from whatever predator it was fleeing).
                            if (result.x === 0 && result.y === 0) {
                              const escapeDirections = [];

                              if (nearLeft || nearRight) {
                                escapeDirections.push({ x: 0, y: 1 });
                                escapeDirections.push({ x: 0, y: -1 });
                              }

                              if (nearTop || nearBottom) {
                                escapeDirections.push({ x: 1, y: 0 });
                                escapeDirections.push({ x: -1, y: 0 });
                              }

                              // Cornered against two walls at once: also allow
                              // moving straight out of the corner.
                              if ((nearLeft || nearRight) && (nearTop || nearBottom)) {
                                escapeDirections.push(normalizeVector({
                                  x: nearLeft ? 1 : -1,
                                  y: nearTop ? 1 : -1
                                }));
                              }

                              if (escapeDirections.length > 0) {
                                let best = escapeDirections[0];
                                let bestScore = -Infinity;

                                for (const candidate of escapeDirections) {
                                  // Alignment with the original desired direction
                                  // (e.g. away from a predator) picks the correct
                                  // side to slide toward.
                                  let score =
                                    candidate.x * steering.x +
                                    candidate.y * steering.y;

                                  // Break ties (e.g. steering is perfectly
                                  // perpendicular to the wall) with a per-unit
                                  // fixed bias instead of Math.random(), so the
                                  // choice stays consistent frame to frame
                                  // instead of vibrating in place.
                                  score += candidate.x * unit.cornerBias.x * 0.001;
                                  score += candidate.y * unit.cornerBias.y * 0.001;

                                  if (score > bestScore) {
                                    bestScore = score;
                                    best = candidate;
                                  }
                                }

                                result = best;
                              }
                            }

                            return normalizeVector(result);
                          }

              function applySteering(unit, steering) {
                unit.vx = steering.x * unit.speed;
                unit.vy = steering.y * unit.speed;

                unit.x += unit.vx;
                unit.y += unit.vy;
              }
        function keepInsideArena(unit) {
                  const { width, height } = getArenaBounds();

                  const unitSize = unit.radius * 2;

                  const maxX = width - unitSize;
                  const maxY = height - unitSize;

                  if (unit.x < 0) {
                    unit.x = 0;
                  }

                  if (unit.x > maxX) {
                    unit.x = maxX;
                  }

                  if (unit.y < 0) {
                    unit.y = 0;
                  }

                  if (unit.y > maxY) {
                    unit.y = maxY;
                  }
                }

        function seek(unit, target) {
            if (!target) {
              return { x: 0, y: 0 };
            }

            const desired = {
              x: target.x - unit.x,
              y: target.y - unit.y
            };

            return normalizeVector(desired);
          }

        function gameLoop() {
          if (!gameRunning) return;

          updateUnits();
          drawUnits();
          updateLeaderboard();

          requestAnimationFrame(gameLoop);
        }

        // Let the toggle take effect immediately, even mid-match, instead of
        // only being read once when GO is pressed.
        ammoRespawnToggle.addEventListener("change", () => {
          ammoRespawnEnabled = ammoRespawnToggle.checked;
          ammoRespawnTimer = 0;
        });

        goButton.addEventListener("click", () => {
          gameMode = gameModeSelect.value;

          // GO only creates the battle setup. The simulation remains frozen
          // until the player presses START below the arena.
          spawnUnits();
        });

        startButton.addEventListener("click", () => {
          if (units.length === 0) return;

          gameRunning = true;
          startButton.style.display = "none";

          requestAnimationFrame(gameLoop);
        });

        arena.addEventListener("click", (event) => {
          if (!gameRunning || !selectedPlayer || !units.includes(selectedPlayer)) return;
          movePlayerTo(selectedPlayer, event.clientX - arena.getBoundingClientRect().left,
            event.clientY - arena.getBoundingClientRect().top);
        });

        arena.addEventListener("contextmenu", (event) => {
          event.preventDefault();
        });

        arena.addEventListener("mousedown", (event) => {
          if (event.button !== 2) return;
          event.preventDefault();

          if (!selectedPlayer || !units.includes(selectedPlayer)) return;
          shootPlayerInDirection(selectedPlayer, event.clientX, event.clientY);
        });

    </script>
